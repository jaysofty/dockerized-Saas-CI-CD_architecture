services:

  postgres:
    image: postgres:16-alpine
    container_name: formflow-postgres

    restart: unless-stopped

    env_file:
      - .env.database

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - formflow-network


  backend:
    image: formflow-backend:dev

    build:
      context: ../backend
      dockerfile: Dockerfile

    container_name: formflow-backend

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - .env.backend

    ports:
      - "5000:5000"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

    networks:
      - formflow-network


  frontend:
    image: formflow-frontend:dev

    build:
      context: ../frontend
      dockerfile: Dockerfile

    container_name: formflow-frontend

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    env_file:
      - .env.frontend

    ports:
      - "3000:3000"

    networks:
      - formflow-network


  nginx:
    image: formflow-nginx:dev

    build:
      context: ./nginx

    container_name: formflow-nginx

    restart: unless-stopped

    depends_on:
      frontend:
        condition: service_started

    ports:
      - "80:80"

    networks:
      - formflow-network


volumes:
  postgres-data:


networks:
  formflow-network: