name: Build, Push and Deploy

on:
  push:
    branches:
      - dev

permissions:
  contents: read

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:

  ####################################################
  # BUILD + PUSH
  ####################################################

  docker:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      ####################################################
      # Backend
      ####################################################

      - name: Build Backend
        run: |
          docker build \
            -t kunzydev/formflow-backend:${IMAGE_TAG} \
            -f backend/Dockerfile \
            ./backend

      - name: Push Backend
        run: docker push kunzydev/formflow-backend:${IMAGE_TAG}

      ####################################################
      # Frontend
      ####################################################

      - name: Build Frontend
        run: |
          docker build \
            -t kunzydev/formflow-frontend:${IMAGE_TAG} \
            -f frontend/Dockerfile \
            ./frontend

      - name: Push Frontend
        run: docker push kunzydev/formflow-frontend:${IMAGE_TAG}

      ####################################################
      # Nginx
      ####################################################

      - name: Build Nginx
        run: |
          docker build \
            -t kunzydev/formflow-nginx:${IMAGE_TAG} \
            -f deployment/nginx/Dockerfile \
            ./deployment/nginx

      - name: Push Nginx
        run: docker push kunzydev/formflow-nginx:${IMAGE_TAG}

  ####################################################
  # DEPLOY TO AZURE VM
  ####################################################

  deploy:

    needs: docker

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      ####################################################
      # Copy Deployment Folder
      ####################################################

      - name: Copy Deployment Files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          source: "deployment"
          target: "/opt/formflow"
          overwrite: true
          strip_components: 1

      ####################################################
      # Deploy Latest Images
      ####################################################

      - name: Deploy Containers
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |

            set -e

            echo "========================================="
            echo "Starting FormFlow Deployment..."
            echo "========================================="

            mkdir -p /opt/formflow

            cd /opt/formflow/deployment

            echo "Stopping old containers..."

            docker compose \
              --env-file .env.production \
              -f docker-compose.prod.yml \
              down --remove-orphans

            echo "Pulling latest images..."

            docker compose \
              --env-file .env.production \
              -f docker-compose.prod.yml \
              pull

            echo "Starting new containers..."

            docker compose \
              --env-file .env.production \
              -f docker-compose.prod.yml \
              up -d

            echo "Cleaning dangling images..."

            docker image prune -f

            echo ""
            echo "Running Containers"
            docker ps

      ####################################################
      # HEALTH CHECK
      ####################################################

      - name: Verify Deployment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |

            echo "Waiting for application..."
            sleep 20

            echo "Checking running containers..."
            docker ps

            echo "Checking Nginx..."

            curl -I http://localhost

            echo ""
            echo "Deployment Successful!"