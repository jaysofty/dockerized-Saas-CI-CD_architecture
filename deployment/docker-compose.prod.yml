
services:

  postgres:
    image: postgres:16-alpine
    container_name: formflow-postgres

    restart: unless-stopped

    env_file:
      - .env.production
      - .env.production.database

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres"]
      interval: 10s
      retries: 5

    networks:
      - formflow

  backend:

    image: kunzydev/formflow-backend:${IMAGE_TAG}

    container_name: formflow-backend

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - .env.production
      - .env.production.backend

    networks:
      - formflow

  frontend:

    image: kunzydev/formflow-frontend:${IMAGE_TAG}

    container_name: formflow-frontend

    restart: unless-stopped

    depends_on:
      - backend

    env_file:
      - .env.production
      - .env.production.frontend

    networks:
      - formflow

  nginx:

    image: kunzydev/formflow-nginx:${IMAGE_TAG}

    container_name: formflow-nginx

    restart: unless-stopped

    depends_on:
      - frontend
      - backend

    ports:

      - "80:80"

    networks:
      - formflow

volumes:

  postgres_data:

networks:

  formflow: