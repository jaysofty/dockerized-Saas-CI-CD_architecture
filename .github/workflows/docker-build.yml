name: Build and Push Docker Images

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:

  docker:

    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: 1.0.2

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      ##################################################
      # Backend
      ##################################################

      - name: Build Backend
        run: |
          docker build \
            -t kunzydev/formflow-backend:${IMAGE_TAG} \
            -f backend/Dockerfile \
            ./backend

      - name: Push Backend
        run: |
          docker push kunzydev/formflow-backend:${IMAGE_TAG}

      ##################################################
      # Frontend
      ##################################################

      - name: Build Frontend
        run: |
          docker build \
            -t kunzydev/formflow-frontend:${IMAGE_TAG} \
            -f frontend/Dockerfile \
            ./frontend

      - name: Push Frontend
        run: |
          docker push kunzydev/formflow-frontend:${IMAGE_TAG}

      ##################################################
      # Nginx
      ##################################################

      - name: Build Nginx
        run: |
          docker build \
            -t kunzydev/formflow-nginx:${IMAGE_TAG} \
            -f deployment/nginx/Dockerfile \
            ./deployment/nginx

      - name: Push Nginx
        run: |
          docker push kunzydev/formflow-nginx:${IMAGE_TAG}